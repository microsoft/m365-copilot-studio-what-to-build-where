name: Step or recommendation feedback
description: Review a particular question or recommendation with the selected answers from the guide.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Feedback is submitted as a **public GitHub issue**. Review the supplied context and remove anything you do not want to share. Do not include personal, customer, or confidential information.

        You can edit every prepopulated field before submitting. Nothing is submitted automatically.
  - type: input
    id: step
    attributes:
      label: Which step or result?
      description: The guide fills in the question heading or "Recommendation" for feedback on the result.
      placeholder: What does the agent need to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context from the guide
      description: Step and result links fill this with your current selections, not a history of clicks. Review, edit, or remove it before submitting.
      placeholder: If you opened this template directly, describe the answers you selected in the guide.
  - type: textarea
    id: feedback
    attributes:
      label: What seems wrong or unclear?
      description: Describe the issue with this question or recommendation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you change?
      description: If relevant, describe the answer or recommendation you expected and include supporting documentation.
